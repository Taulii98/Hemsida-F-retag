<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin – IPM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --bg:#f3f6fa; --fg:#1b2a41; --primary:#2f5a8a; --deep:#132640; --soft:#eaf0f7;
    --muted:#5d6b80; --line:#e1e7ef; --green:#1f7a4d; --green-bg:#e3f4eb; --orange:#a35a00; --orange-bg:#fdf0dc;
    --red:#b42318; --radius:12px; --shadow:0 1px 2px rgba(19,38,64,.05),0 8px 24px -14px rgba(19,38,64,.25);
    --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{color:var(--deep);letter-spacing:-.01em;line-height:1.2}
  .hidden{display:none!important}
  header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .bar{max-width:60rem;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;gap:.75rem}
  .bar img{height:38px}
  .bar .tag{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);border-left:1px solid var(--line);padding-left:.75rem}
  .bar .right{margin-left:auto;display:flex;gap:.5rem;align-items:center}
  .bar .who{font-size:.85rem;color:var(--muted)}
  @media(max-width:560px){.bar .who{display:none}}
  main{max-width:60rem;margin:0 auto;padding:1.5rem 1rem 4rem}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:0;font:inherit;font-weight:700;font-size:.92rem;padding:.7rem 1.1rem;border-radius:10px;cursor:pointer;text-decoration:none;transition:.15s}
  .btn:disabled{opacity:.55;cursor:default}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover:not(:disabled){background:var(--deep)}
  .btn-light{background:var(--soft);color:var(--deep)}
  .btn-light:hover{background:#dde6f1}
  .btn-ghost{background:none;color:var(--muted)}
  .btn-danger{background:#fde8e6;color:var(--red)}
  .btn-danger.sure{background:var(--red);color:#fff}
  .btn-sm{padding:.45rem .75rem;font-size:.82rem;border-radius:8px}

  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:1.5rem}
  .msg{padding:.8rem 1rem;border-radius:10px;font-size:.9rem;margin-bottom:1rem}
  .msg.err{background:#fde8e6;color:var(--red)}
  .msg.ok{background:var(--green-bg);color:var(--green)}
  .msg.info{background:var(--soft);color:var(--deep)}

  /* Inloggning */
  .login{max-width:24rem;margin:3rem auto}
  .login h1{font-size:1.5rem;margin-bottom:.35rem}
  .login p.sub{color:var(--muted);margin-bottom:1.25rem}
  label{display:block;font-size:.85rem;font-weight:600;color:var(--deep);margin-bottom:.9rem}
  input,textarea,select{display:block;margin-top:.3rem;width:100%;font:inherit;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;padding:.7rem .85rem;outline:none;color:var(--fg)}
  input:focus,textarea:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(47,90,138,.15)}
  textarea{min-height:150px;resize:vertical}
  .req{color:var(--red)}

  /* Lista */
  .top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
  .top h1{font-size:1.6rem}
  .filters{display:flex;gap:.35rem;margin-bottom:1rem;flex-wrap:wrap}
  .filters button{border:1px solid var(--line);background:#fff;font:inherit;font-size:.85rem;font-weight:600;color:var(--muted);padding:.45rem .85rem;border-radius:999px;cursor:pointer}
  .filters button.active{background:var(--deep);border-color:var(--deep);color:#fff}
  .filters .count{opacity:.7;margin-left:.2rem}
  .row{display:grid;grid-template-columns:88px 1fr auto;gap:1rem;align-items:center;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:.75rem;margin-bottom:.75rem}
  .thumb{width:88px;height:66px;border-radius:8px;object-fit:cover;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--muted)}
  .row h3{font-size:1.02rem}
  .row .meta{font-size:.85rem;color:var(--muted);margin-top:.1rem}
  .badge{display:inline-block;font-size:.72rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;margin-top:.35rem}
  .badge.pagaende{background:var(--orange-bg);color:var(--orange)}
  .badge.avslutad{background:var(--green-bg);color:var(--green)}
  .actions{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
  @media(max-width:620px){.row{grid-template-columns:72px 1fr}.thumb{width:72px;height:56px}.actions{grid-column:1/-1;justify-content:flex-start}}
  .empty{text-align:center;color:var(--muted);padding:3rem 1rem;background:#fff;border-radius:var(--radius);border:1px dashed var(--line)}

  /* Formulär */
  .form h1{font-size:1.4rem;margin-bottom:1.25rem}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  .status-pick{display:flex;gap:.5rem;margin-top:.3rem}
  .status-pick label{flex:1;margin:0;display:flex;align-items:center;gap:.5rem;border:1px solid var(--line);border-radius:10px;padding:.7rem .85rem;cursor:pointer;font-weight:600}
  .status-pick input{width:auto;margin:0}
  .status-pick label:has(input:checked){border-color:var(--primary);background:var(--soft)}
  .section-title{font-size:.85rem;font-weight:700;color:var(--deep);margin:1.25rem 0 .5rem}
  .hint{font-size:.8rem;color:var(--muted);margin-top:-.4rem;margin-bottom:.6rem}
  .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.6rem}
  .img{position:relative;border-radius:10px;overflow:hidden;background:var(--soft);aspect-ratio:4/3}
  .img img{width:100%;height:100%;object-fit:cover;display:block}
  .img .cover{position:absolute;left:6px;top:6px;background:var(--deep);color:#fff;font-size:.68rem;font-weight:700;padding:.15rem .45rem;border-radius:6px}
  .img .tools{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}
  .img .tools button{border:0;background:rgba(255,255,255,.95);color:var(--deep);font:inherit;font-size:.75rem;font-weight:700;padding:.3rem .5rem;border-radius:6px;cursor:pointer}
  .img .tools button.x{color:var(--red)}
  .add-img{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;border:2px dashed #c7d3e2;border-radius:10px;aspect-ratio:4/3;cursor:pointer;color:var(--primary);font-weight:700;font-size:.85rem;background:#fbfcfe;margin:0}
  .add-img span{font-size:1.6rem;line-height:1}
  .add-img input{display:none}
  .form-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.5rem;flex-wrap:wrap}
  .progress{font-size:.88rem;color:var(--muted);align-self:center;margin-right:auto}
  .badge.kommande{background:#e4eefb;color:#2a5ea8}
  .sections{display:flex;gap:.25rem;background:#fff;border-radius:12px;padding:.3rem;box-shadow:var(--shadow);margin-bottom:1.5rem;overflow-x:auto}
  .sections button{flex:1;white-space:nowrap;border:0;background:none;font:inherit;font-weight:700;font-size:.92rem;color:var(--muted);padding:.65rem 1rem;border-radius:9px;cursor:pointer}
  .sections button.active{background:var(--deep);color:#fff}
  .sections .n{display:inline-block;min-width:1.3rem;padding:0 .35rem;margin-left:.3rem;border-radius:999px;background:#e45b4b;color:#fff;font-size:.72rem;line-height:1.3rem}
  .more{display:block;width:100%;margin-top:.5rem}
  select.st{width:auto;display:inline-block;margin:0;padding:.42rem .6rem;font-size:.82rem;font-weight:600;border-radius:8px}
  .app{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:1.1rem 1.25rem;margin-bottom:.75rem}
  .app .h{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start}
  .app h3{font-size:1.05rem}
  .app .meta{font-size:.85rem;color:var(--muted)}
  .app .msgtxt{margin-top:.6rem;font-size:.92rem;white-space:pre-line;color:var(--fg);background:var(--bg);border-radius:8px;padding:.7rem .85rem}
  .app .links{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.75rem}
  .check{display:flex;align-items:center;gap:.6rem;font-weight:600;margin-top:.5rem}
  .check input{width:auto;margin:0}
  .pill{display:inline-block;font-size:.72rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;margin-top:.35rem}
  .pill.on{background:var(--green-bg);color:var(--green)}
  .pill.off{background:#eef1f5;color:var(--muted)}
</style>
</head>

<main>
  <div class="sections hidden" id="sections">
    <button data-s="projekt" class="active">Projekt</button>
    <button data-s="jobb">Lediga tjänster</button>
    <button data-s="ansok">Ansökningar <span class="n hidden" id="appcount"></span></button>
  </div>
  <div id="notice"></div>

  <!-- Inloggning -->
  <section id="v-login" class="login hidden">
    <div class="card">
      <h1>Logga in</h1>
      <p class="sub">Hantera i-pm.se</p>
      <div id="login-msg"></div>
      <form id="login-form">
        <label>Mejl<input type="email" id="l-email" autocomplete="username" required></label>
        <label>Lösenord<input type="password" id="l-pass" autocomplete="current-password" required></label>
        <button class="btn btn-primary" style="width:100%" id="l-btn">Logga in</button>
      </form>
    </div>
  </section>

  <!-- Projektlista -->
  <section id="v-list" class="hidden">
    <div class="top"><h1>Projekt</h1><button class="btn btn-primary" id="new-btn">+ Nytt projekt</button></div>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </section>

  <!-- Projektformulär -->
  <section id="v-form" class="hidden">
    <div class="card form">
      <h1 id="f-heading">Nytt projekt</h1>
      <div id="form-msg"></div>
      <form id="p-form">
        <label>Projektnamn <span class="req">*</span><input id="f-title" required placeholder="t.ex. Parkeringshus Kvarteret Linden"></label>
        <div class="grid2">
          <label>Plats<input id="f-location" placeholder="t.ex. Malmö"></label>
          <label>Typ<input id="f-type" list="types" placeholder="t.ex. Bostad, Lager"></label>
          <label>Kund<input id="f-customer" placeholder="t.ex. Byggbolaget AB"></label>
          <label>Utförandetid<input id="f-period" placeholder="t.ex. Mars – Juni 2026"></label>
        </div>
        <datalist id="types">
          <option value="Bostad"><option value="Parkeringshus"><option value="Lager"><option value="Stålhall">
          <option value="Industri"><option value="Kontor"><option value="Skola"><option value="Påbyggnad">
        </datalist>
        <div class="section-title">Status</div>
        <div class="status-pick">
          <label><input type="radio" name="status" value="kommande"> Kommande</label>
          <label><input type="radio" name="status" value="pagaende" checked> Pågående</label>
          <label><input type="radio" name="status" value="avslutad"> Avslutat</label>
        </div>
        <label style="margin-top:1rem">Beskrivning<textarea id="f-desc" placeholder="Berätta om projektet: vad IPM gjorde, vilka material, något som var speciellt …"></textarea></label>
        <div class="section-title">Bilder</div>
        <p class="hint">Första bilden blir omslagsbild. Bilderna förminskas automatiskt innan de laddas upp.</p>
        <div class="imgs" id="imgs"></div>
        <div class="form-actions">
          <span class="progress" id="progress"></span>
          <button type="button" class="btn btn-light" id="cancel">Avbryt</button>
          <button class="btn btn-primary" id="save">Spara projekt</button>
        </div>
      </form>
    </div>
  </section>

  <!-- Tjänster -->
  <section id="v-jobs" class="hidden">
    <div class="top"><h1>Lediga tjänster</h1><button class="btn btn-primary" id="newjob-btn">+ Ny tjänst</button></div>
    <div id="joblist"></div>
  </section>

  <section id="v-jobform" class="hidden">
    <div class="card form">
      <h1 id="j-heading">Ny tjänst</h1>
      <div id="jform-msg"></div>
      <form id="j-form">
        <label>Titel <span class="req">*</span><input id="j-title" required placeholder="t.ex. Montör betongprefab"></label>
        <div class="grid2">
          <label>Ort<input id="j-location" placeholder="t.ex. Skåne / hela Sverige"></label>
          <label>Anställningsform<input id="j-employment" list="emp" placeholder="t.ex. Heltid"></label>
        </div>
        <datalist id="emp"><option value="Heltid"><option value="Deltid"><option value="Visstid"><option value="Sommarjobb"><option value="Praktik"></datalist>
        <label>Sista ansökningsdag<input id="j-last" placeholder="t.ex. 31 januari 2027 eller Löpande"></label>
        <label>Beskrivning<textarea id="j-desc" placeholder="Vad jobbet innebär, vad ni söker, krav och meriter …"></textarea></label>
        <label class="check"><input type="checkbox" id="j-pub" checked> Visa på hemsidan</label>
        <div class="form-actions">
          <button type="button" class="btn btn-light" id="j-cancel">Avbryt</button>
          <button class="btn btn-primary" id="j-save">Spara tjänst</button>
        </div>
      </form>
    </div>
  </section>

  <!-- Ansökningar -->
  <section id="v-apps" class="hidden">
    <div class="top"><h1>Ansökningar</h1></div>
    <div id="applist"></div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BUCKET='projektbilder',CV_BUCKET='ansokningar',PAGE=3;
const CFG=window.IPM_CONFIG||{};
let db=null;
const VIEWS=['login','list','form','jobs','jobform','apps'];
function show(view){VIEWS.forEach(v=>$('v-'+v).classList.toggle('hidden',v!==view));window.scrollTo(0,0)}
function msg(el,type,text){$(el).innerHTML=text?`<div class="msg ${type}">${text}</div>`:''}
function dateSv(d){try{return new Date(d).toLocaleDateString('sv-SE',{day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}}
// Tryck två gånger för att ta bort
function confirmTwice(btn,fn){
  if(!btn.classList.contains('sure')){const t=btn.textContent;btn.classList.add('sure');btn.textContent='Säker? Tryck igen';
    setTimeout(()=>{if(btn.isConnected){btn.classList.remove('sure');btn.textContent=t}},4000);return}
  btn.disabled=true;fn();
}
function moreBtn(shown,total,onclick){
  if(total<=shown)return null;
  const b=document.createElement('button');b.className='btn btn-light more';
  b.textContent=`Visa fler (${total-shown} till)`;b.onclick=onclick;return b;
}

/* ---------- Start ---------- */
(function start(){
  const ok=CFG.SUPABASE_URL&&!CFG.SUPABASE_URL.includes('KLISTRA')&&CFG.SUPABASE_KEY&&!CFG.SUPABASE_KEY.includes('KLISTRA');
  if(!ok){msg('notice','info','<b>Admin är inte kopplad än.</b> Fyll i de två koderna från Supabase i filen config.js.');show('login');$('l-btn').disabled=true;return}
  if(!window.supabase){msg('notice','err','Kunde inte ladda Supabase. Kontrollera internetanslutningen och ladda om sidan.');return}
  db=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);
  db.auth.getSession().then(({data})=>data.session?loggedIn(data.session):show('login'));
})();

$('login-form').onsubmit=async e=>{
  e.preventDefault();$('l-btn').disabled=true;$('l-btn').textContent='Loggar in …';msg('login-msg');
  const {data,error}=await db.auth.signInWithPassword({email:$('l-email').value.trim(),password:$('l-pass').value});
  $('l-btn').disabled=false;$('l-btn').textContent='Logga in';
  if(error){msg('login-msg','err','Fel mejl eller lösenord.');return}
  loggedIn(data.session);
};
$('logout').onclick=async()=>{await db.auth.signOut();$('logout').classList.add('hidden');$('sections').classList.add('hidden');$('who').textContent='';msg('notice');show('login')};
function loggedIn(session){
  $('who').textContent=session.user.email;$('logout').classList.remove('hidden');$('sections').classList.remove('hidden');
  goSection('projekt');countApps();
}
function goSection(s){
  msg('notice');
  document.querySelectorAll('#sections button').forEach(b=>b.classList.toggle('active',b.dataset.s===s));
  if(s==='projekt')loadList();if(s==='jobb')loadJobs();if(s==='ansok')loadApps();
}
document.querySelectorAll('#sections button').forEach(b=>b.onclick=()=>goSection(b.dataset.s));

/* =============== PROJEKT =============== */
let projects=[],filter='alla',shown=PAGE;
const STATUS={kommande:'Kommande',pagaende:'Pågående',avslutad:'Avslutat'};
async function loadList(){
  show('list');$('list').innerHTML='<div class="empty">Hämtar projekt …</div>';
  const {data,error}=await db.from('projects').select('*').order('created_at',{ascending:false});
  if(error){$('list').innerHTML=`<div class="msg err">Kunde inte hämta projekten. (${esc(error.message)})</div>`;return}
  projects=data||[];shown=PAGE;renderList();
}
function renderList(){
  const n={alla:projects.length,kommande:0,pagaende:0,avslutad:0};projects.forEach(p=>{if(p.status in n)n[p.status]++});
  $('filters').innerHTML=[['alla','Alla'],['kommande','Kommande'],['pagaende','Pågående'],['avslutad','Avslutade']]
    .map(([k,l])=>`<button data-f="${k}" class="${filter===k?'active':''}">${l}<span class="count">${n[k]}</span></button>`).join('');
  $('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;shown=PAGE;renderList()});
  const all=projects.filter(p=>filter==='alla'||p.status===filter);
  if(!all.length){$('list').innerHTML=`<div class="empty">${projects.length?'Inga projekt här.':'Inga projekt än. Tryck på <b>+ Nytt projekt</b> för att lägga till det första.'}</div>`;return}
  $('list').innerHTML=all.slice(0,shown).map(p=>`
    <div class="row">
      ${p.images&&p.images[0]?`<img class="thumb" src="${esc(p.images[0])}" alt="">`:'<div class="thumb">Ingen bild</div>'}
      <div><h3>${esc(p.title)}</h3>
        <div class="meta">${[p.location,p.type,p.period].filter(Boolean).map(esc).join(' · ')||'&nbsp;'}</div>
        <span class="badge ${p.status}">${STATUS[p.status]}</span></div>
      <div class="actions">
        <button class="btn btn-light btn-sm" data-edit="${p.id}">Ändra</button>
        <select class="st" data-st="${p.id}" aria-label="Status">${Object.entries(STATUS).map(([k,l])=>`<option value="${k}" ${p.status===k?'selected':''}>${l}</option>`).join('')}</select>
        <button class="btn btn-danger btn-sm" data-del="${p.id}">Ta bort</button>
      </div>
    </div>`).join('');
  const m=moreBtn(shown,all.length,()=>{shown+=PAGE;renderList()});if(m)$('list').appendChild(m);
  $('list').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(projects.find(p=>p.id===b.dataset.edit)));
  $('list').querySelectorAll('[data-st]').forEach(s=>s.onchange=()=>setStatus(s.dataset.st,s.value,s));
  $('list').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmTwice(b,()=>removeProject(b.dataset.del,b)));
}
async function setStatus(id,next,sel){
  const p=projects.find(x=>x.id===id);sel.disabled=true;
  const {error}=await db.from('projects').update({status:next}).eq('id',id);
  sel.disabled=false;
  if(error){msg('notice','err','Kunde inte ändra status. ('+esc(error.message)+')');sel.value=p.status;return}
  p.status=next;msg('notice','ok',`”${esc(p.title)}” är nu ${STATUS[next].toLowerCase()}.`);renderList();
}
async function removeProject(id,btn){
  const p=projects.find(x=>x.id===id);
  const {error}=await db.from('projects').delete().eq('id',id);
  if(error){msg('notice','err','Kunde inte ta bort projektet. ('+esc(error.message)+')');btn.disabled=false;return}
  const paths=(p.images||[]).map(pathFromUrl).filter(Boolean);
  if(paths.length)db.storage.from(BUCKET).remove(paths).catch(()=>{});
  projects=projects.filter(x=>x.id!==id);msg('notice','ok',`”${esc(p.title)}” är borttaget.`);renderList();
}
$('new-btn').onclick=()=>openForm(null);

let editing=null,imgs=[],removed=[];
function openForm(p){
  editing=p;removed=[];msg('form-msg');msg('notice');$('progress').textContent='';
  $('f-heading').textContent=p?'Ändra projekt':'Nytt projekt';
  $('f-title').value=p?.title||'';$('f-location').value=p?.location||'';$('f-type').value=p?.type||'';
  $('f-customer').value=p?.customer||'';$('f-period').value=p?.period||'';$('f-desc').value=p?.description||'';
  document.querySelector(`input[name=status][value=${p?.status||'pagaende'}]`).checked=true;
  imgs=(p?.images||[]).map(url=>({url,preview:url}));renderImgs();show('form');
}
function renderImgs(){
  $('imgs').innerHTML=imgs.map((im,i)=>`
    <div class="img"><img src="${esc(im.preview)}" alt="">${i===0?'<span class="cover">Omslag</span>':''}
      <div class="tools">${i>0?`<button type="button" data-first="${i}">Gör till omslag</button>`:''}<button type="button" class="x" data-rm="${i}">Ta bort</button></div></div>`).join('')+
    `<label class="add-img"><span>+</span>Lägg till bilder<input type="file" id="f-files" accept="image/*" multiple></label>`;
  $('imgs').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const [im]=imgs.splice(+b.dataset.rm,1);if(im.url)removed.push(im.url);if(im.file)URL.revokeObjectURL(im.preview);renderImgs()});
  $('imgs').querySelectorAll('[data-first]').forEach(b=>b.onclick=()=>{const [im]=imgs.splice(+b.dataset.first,1);imgs.unshift(im);renderImgs()});
  $('f-files').onchange=e=>{[...e.target.files].forEach(file=>imgs.push({file,preview:URL.createObjectURL(file)}));renderImgs()};
}
$('cancel').onclick=()=>{imgs.forEach(im=>im.file&&URL.revokeObjectURL(im.preview));show('list')};
async function shrink(file,max=2000){
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));return blob?{blob,type:'image/jpeg'}:null;
  }catch(e){return null}
}
function pathFromUrl(url){const i=url.indexOf('/'+BUCKET+'/');return i<0?null:decodeURIComponent(url.slice(i+BUCKET.length+2))}
$('p-form').onsubmit=async e=>{
  e.preventDefault();msg('form-msg');const save=$('save');save.disabled=true;$('cancel').disabled=true;
  try{
    const urls=[];const total=imgs.filter(i=>i.file).length;let done=0;
    for(const im of imgs){
      if(im.url){urls.push(im.url);continue}
      done++;$('progress').textContent=`Laddar upp bild ${done} av ${total} …`;
      const small=await shrink(im.file);
      const ext=small?'jpg':((im.file.name.split('.').pop()||'jpg').toLowerCase());
      const path=`${new Date().toISOString().slice(0,10)}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const {error}=await db.storage.from(BUCKET).upload(path,small?small.blob:im.file,{contentType:small?small.type:im.file.type});
      if(error)throw new Error('Bilden kunde inte laddas upp: '+error.message);
      im.url=db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;urls.push(im.url);
    }
    $('progress').textContent='Sparar …';
    const row={title:$('f-title').value.trim(),location:$('f-location').value.trim()||null,type:$('f-type').value.trim()||null,
      customer:$('f-customer').value.trim()||null,period:$('f-period').value.trim()||null,
      status:document.querySelector('input[name=status]:checked').value,description:$('f-desc').value.trim()||null,images:urls};
    const res=editing?await db.from('projects').update(row).eq('id',editing.id):await db.from('projects').insert(row);
    if(res.error)throw new Error('Projektet kunde inte sparas: '+res.error.message);
    const paths=removed.map(pathFromUrl).filter(Boolean);if(paths.length)db.storage.from(BUCKET).remove(paths).catch(()=>{});
    await loadList();msg('notice','ok',`”${esc(row.title)}” är sparat och syns nu på hemsidan.`);
  }catch(err){
    msg('form-msg','err',esc(err.message)+(/status/.test(err.message)?'<br>Har ni kört steg 2 i Supabase (supabase-steg2.sql)?':''));
  }finally{save.disabled=false;$('cancel').disabled=false;$('progress').textContent=''}
};

/* =============== LEDIGA TJÄNSTER =============== */
let jobs=[],jobShown=PAGE,editingJob=null;
async function loadJobs(){
  show('jobs');$('joblist').innerHTML='<div class="empty">Hämtar tjänster …</div>';
  const {data,error}=await db.from('jobs').select('*').order('created_at',{ascending:false});
  if(error){$('joblist').innerHTML=`<div class="msg err">Kunde inte hämta tjänsterna. Har ni kört supabase-steg2.sql i Supabase? (${esc(error.message)})</div>`;return}
  jobs=data||[];jobShown=PAGE;renderJobs();
}
function renderJobs(){
  if(!jobs.length){$('joblist').innerHTML='<div class="empty">Inga tjänster än. Tryck på <b>+ Ny tjänst</b> för att lägga ut en.<br><br>Spontanansökan finns alltid på hemsidan.</div>';return}
  $('joblist').innerHTML=jobs.slice(0,jobShown).map(j=>`
    <div class="row" style="grid-template-columns:1fr auto">
      <div><h3>${esc(j.title)}</h3>
        <div class="meta">${[j.location,j.employment,j.last_date?'Sista dag: '+j.last_date:''].filter(Boolean).map(esc).join(' · ')||'&nbsp;'}</div>
        <span class="pill ${j.published?'on':'off'}">${j.published?'Syns på hemsidan':'Dold'}</span></div>
      <div class="actions">
        <button class="btn btn-light btn-sm" data-jedit="${j.id}">Ändra</button>
        <button class="btn btn-light btn-sm" data-jpub="${j.id}">${j.published?'Dölj':'Visa'}</button>
        <button class="btn btn-danger btn-sm" data-jdel="${j.id}">Ta bort</button>
      </div>
    </div>`).join('');
  const m=moreBtn(jobShown,jobs.length,()=>{jobShown+=PAGE;renderJobs()});if(m)$('joblist').appendChild(m);
  $('joblist').querySelectorAll('[data-jedit]').forEach(b=>b.onclick=()=>openJob(jobs.find(j=>j.id===b.dataset.jedit)));
  $('joblist').querySelectorAll('[data-jpub]').forEach(b=>b.onclick=async()=>{
    const j=jobs.find(x=>x.id===b.dataset.jpub);b.disabled=true;
    const {error}=await db.from('jobs').update({published:!j.published}).eq('id',j.id);
    if(error){msg('notice','err','Kunde inte ändra. ('+esc(error.message)+')');b.disabled=false;return}
    j.published=!j.published;msg('notice','ok',`”${esc(j.title)}” ${j.published?'syns nu på hemsidan':'är nu dold'}.`);renderJobs()});
  $('joblist').querySelectorAll('[data-jdel]').forEach(b=>b.onclick=()=>confirmTwice(b,async()=>{
    const j=jobs.find(x=>x.id===b.dataset.jdel);
    const {error}=await db.from('jobs').delete().eq('id',j.id);
    if(error){msg('notice','err','Kunde inte ta bort. ('+esc(error.message)+')');b.disabled=false;return}
    jobs=jobs.filter(x=>x.id!==j.id);msg('notice','ok',`”${esc(j.title)}” är borttagen.`);renderJobs()}));
}
$('newjob-btn').onclick=()=>openJob(null);
function openJob(j){
  editingJob=j;msg('jform-msg');msg('notice');
  $('j-heading').textContent=j?'Ändra tjänst':'Ny tjänst';
  $('j-title').value=j?.title||'';$('j-location').value=j?.location||'';$('j-employment').value=j?.employment||'';
  $('j-last').value=j?.last_date||'';$('j-desc').value=j?.description||'';$('j-pub').checked=j?j.published:true;
  show('jobform');
}
$('j-cancel').onclick=()=>show('jobs');
$('j-form').onsubmit=async e=>{
  e.preventDefault();$('j-save').disabled=true;
  const row={title:$('j-title').value.trim(),location:$('j-location').value.trim()||null,employment:$('j-employment').value.trim()||null,
    last_date:$('j-last').value.trim()||null,description:$('j-desc').value.trim()||null,published:$('j-pub').checked};
  const res=editingJob?await db.from('jobs').update(row).eq('id',editingJob.id):await db.from('jobs').insert(row);
  $('j-save').disabled=false;
  if(res.error){msg('jform-msg','err','Kunde inte spara: '+esc(res.error.message));return}
  await loadJobs();msg('notice','ok',`”${esc(row.title)}” är sparad${row.published?' och syns på hemsidan':''}.`);
};

/* =============== ANSÖKNINGAR =============== */
let apps=[],appShown=PAGE;
async function countApps(){
  try{const {count}=await db.from('applications').select('id',{count:'exact',head:true});
    if(count){$('appcount').textContent=count;$('appcount').classList.remove('hidden')}else $('appcount').classList.add('hidden')}catch(e){}
}
async function loadApps(){
  show('apps');$('applist').innerHTML='<div class="empty">Hämtar ansökningar …</div>';
  const {data,error}=await db.from('applications').select('*').order('created_at',{ascending:false});
  if(error){$('applist').innerHTML=`<div class="msg err">Kunde inte hämta ansökningarna. Har ni kört supabase-steg2.sql i Supabase? (${esc(error.message)})</div>`;return}
  apps=data||[];appShown=PAGE;renderApps();
}
function renderApps(){
  if(!apps.length){$('applist').innerHTML='<div class="empty">Inga ansökningar än. När någon skickar en ansökan på hemsidan dyker den upp här.</div>';return}
  $('applist').innerHTML=apps.slice(0,appShown).map(a=>`
    <div class="app">
      <div class="h"><div><h3>${esc(a.name)}</h3><div class="meta">${esc(a.job_title||'Spontanansökan')} · ${dateSv(a.created_at)}</div></div>
        <button class="btn btn-danger btn-sm" data-adel="${a.id}">Ta bort</button></div>
      ${a.message?`<div class="msgtxt">${esc(a.message)}</div>`:''}
      <div class="links">
        <a class="btn btn-light btn-sm" href="mailto:${esc(a.email)}">✉ ${esc(a.email)}</a>
        ${a.phone?`<a class="btn btn-light btn-sm" href="tel:${esc(a.phone)}">☎ ${esc(a.phone)}</a>`:''}
        ${a.cv_path?`<button class="btn btn-primary btn-sm" data-cv="${esc(a.cv_path)}">Öppna CV</button>`:''}
      </div>
    </div>`).join('');
  const m=moreBtn(appShown,apps.length,()=>{appShown+=PAGE;renderApps()});if(m)$('applist').appendChild(m);
  $('applist').querySelectorAll('[data-cv]').forEach(b=>b.onclick=async()=>{
    const w=window.open('','_blank');
    const {data,error}=await db.storage.from(CV_BUCKET).createSignedUrl(b.dataset.cv,600);
    if(error||!data){if(w)w.close();msg('notice','err','Kunde inte öppna CV:t.');return}
    if(w)w.location=data.signedUrl;else location.href=data.signedUrl;
  });
  $('applist').querySelectorAll('[data-adel]').forEach(b=>b.onclick=()=>confirmTwice(b,async()=>{
    const a=apps.find(x=>x.id===b.dataset.adel);
    const {error}=await db.from('applications').delete().eq('id',a.id);
    if(error){msg('notice','err','Kunde inte ta bort. ('+esc(error.message)+')');b.disabled=false;return}
    if(a.cv_path)db.storage.from(CV_BUCKET).remove([a.cv_path]).catch(()=>{});
    apps=apps.filter(x=>x.id!==a.id);msg('notice','ok','Ansökan är borttagen.');renderApps();countApps()}));
}
